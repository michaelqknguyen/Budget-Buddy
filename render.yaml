# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: budgetbuddy-ky
    env: docker
    dockerfilePath: Dockerfile
    region: ohio
    plan: free
    numInstances: 1
    domains:
      - 'budgetbuddy.planetexpress.club'
      - 'planetexpress.club'
      - 'www.planetexpress.club'
    envVars:
      - key: DJANGO_ACCOUNT_ALLOW_REGISTRATION
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: budgetbuddy-ky.onrender.com,budgetbuddy.planetexpress.club,www.planetexpress.club,planetexpress.club
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: WEB_CONCURRENCY
        value: 4
      - key: DATABASE_URL
        fromDatabase:
          name: budgetbuddy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: budgetbuddy-redis
          type: redis
          property: connectionString
  - type: redis
    name: budgetbuddy-redis
    region: ohio
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: budgetbuddy-db
    region: ohio
    plan: starter
    ipAllowList: []
