[flake8]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,.venv,venv

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,.venv,venv

[isort]
profile = black
known_django = django
known_third_party = allauth,crispy_forms,debug_toolbar,environ,factory,faker,rest_framework,yfinance
known_first_party = budgetbuddy,config
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,FIRSTPARTY,LOCALFOLDER
skip_glob = */migrations/*,.venv/*,venv/*

[mypy]
python_version = 3.13
check_untyped_defs = True
ignore_errors = False
ignore_missing_imports = True
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
# Django model fields are dynamically typed descriptors that mypy cannot resolve
# without django-stubs. Suppress until django-stubs is adopted.
disable_error_code = var-annotated

[mypy-*.migrations.*]
# Django migrations should not produce any errors:
ignore_errors = True

[mypy-*.tests.*]
# Test files use factory_boy which has no type stubs, causing
# widespread attr-defined and assignment errors. Suppress for tests.
ignore_errors = True

[mypy-budgetbuddy.conftest]
ignore_errors = True
